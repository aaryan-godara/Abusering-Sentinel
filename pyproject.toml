[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abusering-sentinel"
version = "0.1.0"
description = "Graph-based detection of coordinated account abuse rings using synthetic data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["fraud-detection", "graph-analytics", "abuse-detection", "machine-learning"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.5,<2.0",
    "networkx>=3.3,<4.0",
    "faker>=26.0,<38.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pyarrow>=16,<22",
    "xgboost>=2.0,<3.1",
    "shap>=0.44,<0.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["."]
